
<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail podujatia | KamV ČESKOSLOVENSKU</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .detail {
      max-width: 750px;
      margin: 40px auto;
      padding: 24px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }
    .detail h1 { color: #174c40; }
    .back { color: #174c40; }
  </style>
</head>
<body>
  <main class="detail">
    <a class="back" href="index.html">← Späť na hlavnú stránku</a>
    <div id="detail">
      <p>Načítavam podujatie...</p>
    </div>
  </main>

  <script>
    async function nacitajPodujatie() {
      const detail = document.getElementById('detail');
      const id = new URLSearchParams(location.search).get('id');

      try {
        const response = await fetch(
  'https://ijctkszgvhinoubtbyfb.supabase.co/rest/v1/events?select=*',
  {
    headers: {
      apikey: 'sb_publishable_behBeiZHFJxXRVL2L6VueQ_EFMm-5DY'
    }
  }
);
        if (!response.ok) throw new Error('Načítanie zlyhalo');

        const podujatia = await response.json();
        const p = podujatia.find(p => p.title === id);

if (p) {
  p.nazov = p.title;
  p.mesto = p.city;
  p.krajina = p.country;
  p.datum = p.start_date;
  p.kategoria = p.category;
  p.popis = p.description;
  p.cas = p.start_time;
p.miestoKonania = p.venue;
p.adresa = p.address;
p.cena = p.price;
p.ucinkujuci = p.performers;
  p.vstupenky = p.ticket_url;
}

if (id === null || !p) {

          detail.textContent = 'Podujatie sa nenašlo.';
          return;
        }

        detail.replaceChildren();

        const nadpis = document.createElement('h1');
        nadpis.textContent = p.nazov;

        const miesto = document.createElement('p');
        miesto.textContent = '📍 ' + p.mesto + ', ' + p.krajina;

        const datum = document.createElement('p');
        datum.textContent = '📅 ' + p.datum;

        const kategoria = document.createElement('p');
        kategoria.textContent = '🎫 ' + p.kategoria;

        const popis = document.createElement('p');
        popis.textContent = p.popis || 'Popis zatiaľ nie je dostupný.';

      const dalsieInfo = document.createElement('div');

[
  ['🕒 Čas', p.cas],
  ['🏛️ Miesto konania', p.miestoKonania],
  ['📍 Adresa', p.adresa],
  ['💶 Cena', p.cena],
  ['🎤 Účinkujúci', p.ucinkujuci]
].forEach(([nazov, hodnota]) => {
  if (hodnota) {
    const riadok = document.createElement('p');
    riadok.textContent = nazov + ': ' + hodnota;
 
    dalsieInfo.append(riadok);
  }
});
        
if (p.vstupenky) {
  const tlacidlo = document.createElement('a');
  tlacidlo.textContent = '🎟️ Kúpiť vstupenky';
  tlacidlo.href = p.vstupenky;
  tlacidlo.target = '_blank';
  tlacidlo.rel = 'noopener noreferrer';
  tlacidlo.style.display = 'inline-block';
  tlacidlo.style.padding = '12px 20px';
  tlacidlo.style.backgroundColor = '#174c40';
  tlacidlo.style.color = 'white';
  tlacidlo.style.borderRadius = '8px';
  tlacidlo.style.textDecoration = 'none';
  dalsieInfo.append(tlacidlo);
}

        detail.append(nadpis, miesto, datum, kategoria, popis, dalsieInfo);
      } catch (error) {
        detail.textContent = 'Nepodarilo sa načítať podujatie.';
      }
    }

    nacitajPodujatie();
  </script>
</body>
</html>
